<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>천 국여단 볼매붕가배 서밋</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    #content {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
      transition: background-color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    .dark-mode #content {
      background-color: #333;
      border-color: #555;
    }
    #toggleButton {
      margin-top: 10px;
      padding: 10px;
      cursor: pointer;
      border: none;
      background-color: #007bff;
      color: #fff;
      font-size: 16px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    #toggleButton:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div id="content"></div>

  <button id="toggleButton">다크모드 전환</button>

  <script>
    async function renderMarkdown() {
      // 마크다운 텍스트
      const markdown = `
# 천 국 여단 내전
## 제 1회 볼매붕가 보험사기배 서밋대회

- 2024년 12월 2일 ~ 12월 8일 23:59 (결과 공유 기준)
- 경기 후, 승자가 크레스니크에게 개인톡으로 결과 공유
- 경기 중 리플 공유 금지 (사유: 전력 노출)

### 상금
얼마더라 볼매한테 물어보고 옴

### 대진표
짱루팀 vs 사니팀  
선봉 분평 으막 vs 사니  
중견 눈밭 짱 vs 쿵  
대장 트윈 크크 vs 볼매  (12/1 20:00)

이슈팀 vs 짱루팀  
선봉 계류 영어 vs 으막  
중견 트윈 이슈 vs 짱  
대장 용암 류 vs 크크  (잠정 12/4 업무시간)

이슈팀 vs 사니팀  
선봉 눈밭 영어 vs 사니  
중견 동굴 이슈 vs 볼붕  
대장 계류 류 vs 쿵  (12/2 18:00)

화이팅~
      `;

      // 최신 marked.js API 사용
      const content = document.getElementById('content');
      content.innerHTML = marked.parse(markdown); // 최신 API는 parse 메서드 사용
    }

    // marked.js를 로드하고 렌더링 실행
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
    script.onload = renderMarkdown; // 라이브러리 로드 후 실행
    document.head.appendChild(script);

        // 다크모드 전환 기능 추가
    const toggleButton = document.getElementById('toggleButton');
    toggleButton.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
