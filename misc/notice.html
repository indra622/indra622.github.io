<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25년 꽃바람솔바람 삼척여행</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/switchery/0.8.2/switchery.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    #content {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
      transition: background-color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    .dark-mode #content {
      background-color: #333;
      border-color: #555;
    }
    #toggleSwitchContainer {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <div id="toggleSwitchContainer">
    <label for="toggleSwitch">Dark mode</label>
    <input type="checkbox" id="toggleSwitch">
  </div>

  <script>
    async function renderMarkdown() {
      // 마크다운 텍스트
      const markdown = `

# 4월 28일 (월) – 동해 관광 및 삼척 이동

- 13:30 동해역 도착 및 관영이와 합류
- 14:00 천곡황금박쥐동굴 방문
  - 주소: 강원도 동해시 동굴로 50
  - 운영시간: 09:00~18:00
  - 입장료: 성인 4,000원
  - 특징: 도심 속 석회암 동굴로, 다양한 종유석과 석순을 감상할 수 있음
- 15:30 묵호 논골담길 산책
  - 특징: 벽화와 바다 전망을 감상할 수 있는 산책로
- 17:00 묵호항 방문
  - 특징: 신선한 해산물을 구경할 수 있는 대표 어항
- 18:00 저녁 식사 – 어향
  - 주소: 강원도 동해시 중앙시장길 24
  - 메뉴: 열기구이+나베, 임연수구이+나베 (각 12,000원)
  - 특징: 생선구이와 매생이 누룽지 나베가 함께 제공되는 가성비 맛집
  - 운영시간: 10:00~22:00 (브레이크타임 15:00~17:00), 화요일 휴무
- 19:30 삼척 솔비치 리조트 이동 및 체크인
- 20:30 자유 시간 및 휴식

# 4월 29일 (화) – 울진 관광

- 08:00 울진으로 이동 (약 1시간 30분 소요)
- 09:30 등기산 스카이워크 방문
  - 주소: 경북 울진군 후포면 후포리 산141-21
  - 운영시간: 09:00~17:00
  - 특징: 바다 위를 걷는 스릴을 느낄 수 있음
- 11:00 성류굴 탐방
  - 주소: 경북 울진군 근남면 성류굴로 221
  - 운영시간: 09:00~17:00
  - 특징: 천연기념물 제155호로 지정된 석회암 동굴
- 12:30 점심 식사 – 후포항 인근 식당 (해산물 요리)
- 14:00 울진 지역 자유 관광
- 17:00 삼척으로 복귀
- 18:30 저녁 식사 – 일미담
  - 주소: 강원도 삼척시 테마타운길 19
  - 메뉴: 해물 간장 모둠장, 소불고기 전골 등
  - 특징: 다양한 해산물 요리를 즐길 수 있는 맛집
- 20:00 자유 시간 및 휴식

# 4월 30일 (수) – 삼척 지역 힐링

- 09:00 삼척 해변 산책 및 리조트 내 시설 이용
  - 특징: 해변 산책, 스파, 오락실 등 부대시설 이용 가능
- 11:30 점심 식사 – 부일막국수
  - 주소: 강원도 삼척시 중앙로 296
  - 메뉴: 막국수, 수육
  - 특징: 현지인에게 인기 있는 막국수 전문점
- 13:00 삼척 중앙시장 방문
  - 특징: 지역 특산물과 간식을 구매할 수 있는 전통시장
- 15:00 자유 시간 및 휴식
- 17:30 저녁 식사 – 일미어담
  - 주소: 강원도 삼척시 테마타운길 19
  - 메뉴: 생선구이 정식
  - 특징: 가성비 좋은 생선구이 전문점
- 19:00 자유 시간 및 휴식
                  `;

      // 최신 marked.js API 사용
      const content = document.getElementById('content');
      content.innerHTML = marked.parse(markdown); // 최신 API는 parse 메서드 사용
    }

    // marked.js를 로드하고 렌더링 실행
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
    script.onload = renderMarkdown; // 라이브러리 로드 후 실행
    document.head.appendChild(script);

    // 시스템 설정에 따른 다크모드 기본값 적용
    const toggleSwitch = document.getElementById('toggleSwitch');
    const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

    if (prefersDarkScheme.matches) {
      document.body.classList.add('dark-mode');
      toggleSwitch.checked = true;
    }

    // 다크모드 전환 스위치 기능 추가
    toggleSwitch.addEventListener('change', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/switchery/0.8.2/switchery.min.js"></script>
  <script>
    // 스위치 스타일 적용
    const toggleSwitchElement = document.getElementById('toggleSwitch');
    const switchery = new Switchery(toggleSwitchElement, { color: '#007bff', secondaryColor: '#ccc', jackColor: '#fff' });
  </script>
</body>
</html>
