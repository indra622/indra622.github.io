<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>천 국여단 볼매붕가배 서밋</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/switchery/0.8.2/switchery.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    #content {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
      transition: background-color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    .dark-mode #content {
      background-color: #333;
      border-color: #555;
    }
    #toggleSwitchContainer {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <div id="toggleSwitchContainer">
    <label for="toggleSwitch">Dark mode</label>
    <input type="checkbox" id="toggleSwitch">
  </div>

  <script>
    async function renderMarkdown() {
      // 마크다운 텍스트
      const markdown = `
# 천 국 여단 내전
### 제 1회 볼매붕가 보험사기배 서밋대회

- 2024년 12월 2일 ~ 12월 8일 23:59 (결과 공유 기준)
- 경기 후, 승자가 크레스니크에게 개인톡으로 결과 공유
  양식 예시
   짱루팀 vs 사니팀
   선봉 하늘정원 크크크(승) vs 사니
- 경기 중 리플 공유 금지 (사유: 전력 노출)

### 상금
1등팀 16만원 상당의 기프트카드  -> 사니팀 확정
(볼매가 만원 깎아서 15만원)  
(볼매 상금방어 오지누)  
2등팀 6만원 상당의 기프트카드  -> 짱루팀 확정
3등팀 3만원 상당의 기프트카드  -> 이슈팀 확정

### 대진표
짱루팀 vs 사니팀  (1:2 사니팀 승)  
선봉 분평 으막 vs 사니(승)  
중견 눈밭 짱 vs 쿵(승)  
대장 트윈 크크 (승) vs 볼매  

이슈팀 vs 짱루팀  (
선봉 계류 영어 vs 으막 (승)    
중견 트윈 이슈 vs 짱  
대장 용암 류 vs 크크 (승)  

이슈팀 vs 사니팀  
선봉 눈밭 영어 vs 사니  
중견 동굴 이슈 vs 볼붕 (승)  
대장 계류 류 vs 쿵 (승)  

화이팅~
      `;

      // 최신 marked.js API 사용
      const content = document.getElementById('content');
      content.innerHTML = marked.parse(markdown); // 최신 API는 parse 메서드 사용
    }

    // marked.js를 로드하고 렌더링 실행
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
    script.onload = renderMarkdown; // 라이브러리 로드 후 실행
    document.head.appendChild(script);

    // 시스템 설정에 따른 다크모드 기본값 적용
    const toggleSwitch = document.getElementById('toggleSwitch');
    const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

    if (prefersDarkScheme.matches) {
      document.body.classList.add('dark-mode');
      toggleSwitch.checked = true;
    }

    // 다크모드 전환 스위치 기능 추가
    toggleSwitch.addEventListener('change', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/switchery/0.8.2/switchery.min.js"></script>
  <script>
    // 스위치 스타일 적용
    const toggleSwitchElement = document.getElementById('toggleSwitch');
    const switchery = new Switchery(toggleSwitchElement, { color: '#007bff', secondaryColor: '#ccc', jackColor: '#fff' });
  </script>
</body>
</html>
