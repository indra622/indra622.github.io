<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25년 꽃바람솔바람 삼척여행</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/switchery/0.8.2/switchery.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    #content {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      background-color: #f9f9f9;
      transition: background-color 0.3s;
    }
    .dark-mode {
      background-color: #121212;
      color: #ffffff;
    }
    .dark-mode #content {
      background-color: #333;
      border-color: #555;
    }
    #toggleSwitchContainer {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <div id="toggleSwitchContainer">
    <label for="toggleSwitch">Dark mode</label>
    <input type="checkbox" id="toggleSwitch">
  </div>

  <script>
    async function renderMarkdown() {
      // 마크다운 텍스트
      const markdown = `
# 25년 춘계 꽃솔 삼척여행

### 4월 28일 (월) – 삼척 환선굴 탐험 & 묵호항 생선구이

- 13:30 동해역 도착 및 관영이와 합류
- 14:00 삼척 환선굴 이동
  - 주소: 강원도 삼척시 신기면 환선로 800
  - 운영시간: 09:00~16:00 (입장마감)
  - 입장료: 성인 4,500원
  - 특징: 우리나라 최대 규모 석회암 동굴, 웅장한 자연 경관
- 15:00 환선굴 탐험 (탐방 약 1시간 30분 소요)
- 17:00 삼척 솔비치 리조트 이동
- 18:30 저녁 식사 – 묵호항 어향
  - 주소: 강원도 동해시 중앙시장길 24
  - 메뉴: 열기구이+나베, 임연수구이+나베
  - 특징: 신선한 생선구이와 매생이 누룽지 나베, 가성비 좋은 맛집
  - 운영시간: 10:00~22:00 (브레이크타임 15:00~17:00), 화요일 휴무
- 20:00 삼척 솔비치 리조트 복귀 및 자유 시간

### 4월 29일 (화) – 울진 자연관광 & 흥부역 이동

- 07:00 삼척 솔비치 출발
- 08:30 울진 성류굴 도착 (오픈런)
  - 주소: 경북 울진군 근남면 성류굴로 221
  - 운영시간: 09:00~17:00
  - 특징: 천연기념물 제155호, 석회암 천연동굴
- 10:30 왕피천공원 산책
  - 주소: 경북 울진군 북면 왕피천로 1635
  - 특징: 천연기념물 왕피천 생태 탐방로
- 12:00 점심 식사 – 신신짬뽕
  - 주소: 경북 울진군 울진읍 울진중앙로 141
  - 메뉴: 얼큰한 해물짬뽕
- 13:30 죽변 스카이레일 방문
  - 주소: 경북 울진군 죽변면 등기산로 17
  - 특징: 바다 위를 달리는 스카이레일, 전망 맛집
- 15:00 국립해양과학관 관람
  - 주소: 경북 울진군 죽변면 해양과학길 50
  - 운영시간: 09:00~18:00
  - 특징: 국내 최대 해양과학 전시관
- 17:00 울진 흥부역 출발 (기차 or 차량)
- 18:30 삼척 도착 및 자유 시간

### 4월 30일 (수) – 삼척 휴식 & 소소한 여행

- 09:00 삼척 해변 산책 및 리조트 내 시설 이용
  - 특징: 해변 산책, 스파, 오락실 등 부대시설 활용
- 11:30 점심 식사 – 부일막국수
  - 주소: 강원도 삼척시 중앙로 296
  - 메뉴: 막국수, 수육
- 13:00 삼척 중앙시장 방문
  - 특징: 지역 특산물, 간식 쇼핑
- 15:00 자유 시간 및 카페 방문
- 17:30 저녁 식사 – 일미어담
  - 주소: 강원도 삼척시 테마타운길 19
  - 메뉴: 생선구이 정식
- 19:00 삼척 솔비치 리조트 복귀 및 마무리

                  `;

      // 최신 marked.js API 사용
      const content = document.getElementById('content');
      content.innerHTML = marked.parse(markdown); // 최신 API는 parse 메서드 사용
    }

    // marked.js를 로드하고 렌더링 실행
    const script = document.createElement('script');
    script.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
    script.onload = renderMarkdown; // 라이브러리 로드 후 실행
    document.head.appendChild(script);

    // 시스템 설정에 따른 다크모드 기본값 적용
    const toggleSwitch = document.getElementById('toggleSwitch');
    const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

    if (prefersDarkScheme.matches) {
      document.body.classList.add('dark-mode');
      toggleSwitch.checked = true;
    }

    // 다크모드 전환 스위치 기능 추가
    toggleSwitch.addEventListener('change', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/switchery/0.8.2/switchery.min.js"></script>
  <script>
    // 스위치 스타일 적용
    const toggleSwitchElement = document.getElementById('toggleSwitch');
    const switchery = new Switchery(toggleSwitchElement, { color: '#007bff', secondaryColor: '#ccc', jackColor: '#fff' });
  </script>
</body>
</html>
