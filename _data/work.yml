# Work 페이지에 표시할 작업 목록
#
# status: published | draft
#   - published: summary 와 details 를 모두 노출한다.
#   - draft: 아직 공개 범위를 확인하지 못한 항목. summary(있으면)와 note 만 노출한다.
#     내용이 확정되면 details 를 채우고 status 를 published 로 바꾸면 된다.
# note: 아직 확인되지 않은 내용에 대한 안내 문구. 비워두면 노출되지 않는다.

items:
  - id: "ceo-agent"
    title: "CEO 에이전트"
    meta: "요구사항 정의"
    status: "published"
    summary: >-
      CEO를 직접 만나 업무를 어떤 순서로 처리하는지, 그때 무엇을 보고 판단하는지 들었다.
      들은 내용을 에이전트가 따를 수 있는 요구사항과 판단 기준으로 옮기는 데 시간을 가장 많이 썼다.
      어려운 쪽은 모델이나 파이프라인을 고르는 일이 아니라, 무엇을 맡길 수 있고 무엇을 사람이
      정해야 하는지 가르는 일이었다.
    details:
      - "CEO와 이야기하면서 업무를 처리하는 순서와 그때 확인하는 항목을 정리했다."
      - "대화에서 나온 말을 그대로 옮기지 않고, 에이전트가 따를 수 있는 문장으로 다시 썼다."
      - "결과물을 보여주고 받은 피드백을 판단 기준과 예외 처리에 반영했다. 이 과정을 여러 번 돌렸다."
      - "에이전트가 대신할 범위와 사람이 결정할 범위를 나눠 두고 시작했다."
    note: "공개할 수 있는 결과가 정리되면 여기에 덧붙인다."

  - id: "sales-pi"
    title: "영업 PI"
    meta: "프로세스 개선"
    status: "draft"
    summary: >-
      영업 업무 프로세스를 개선하는 과제에 AI 개발자로 참여하고 있다.
    note: "공개할 수 있는 범위를 확인하는 중이라 아직 한 줄만 적어 둔다."

  - id: "voxdelta"
    title: "VoxDelta"
    status: "published"
    summary: >-
      한국어 통화 음성의 감정 변화를 분석하는 로컬 우선 음성 AI 프로젝트.

