# Work 페이지에 표시할 작업 목록
#
# status: published | draft
#   - published: summary 와 details 를 모두 노출한다.
#   - draft: 아직 공개 범위를 확인하지 못한 항목. summary(있으면)와 note 만 노출한다.
#     내용이 확정되면 details 를 채우고 status 를 published 로 바꾸면 된다.
# note: 아직 확인되지 않은 내용에 대한 안내 문구. 비워두면 노출되지 않는다.

items:
  - id: "ceo-agent"
    title: "CEO 에이전트"
    meta: "요구사항 정의 · 판단 기준 설계"
    status: "published"
    summary: >-
      CEO를 직접 만나 실제로 업무를 어떤 순서로 처리하는지 듣고, 그 방식을 에이전트가 따를 수 있는
      요구사항과 판단 기준으로 옮긴 작업이다. 모델을 고르거나 파이프라인을 붙이는 일보다,
      무엇을 맡길 수 있고 무엇을 사람이 판단해야 하는지 가려내는 데 대부분의 시간을 썼다.
    details:
      - "CEO와 직접 이야기하며 업무를 처리하는 순서와 그때 확인하는 항목을 정리했다."
      - "대화에서 나온 표현을 그대로 옮기지 않고, 에이전트가 따를 수 있는 요구사항 문장으로 다시 썼다."
      - "결과물을 보여주고 받은 피드백을 판단 기준과 예외 처리에 반영하는 과정을 반복했다."
      - "에이전트가 대신할 범위와 사람이 결정해야 할 범위를 나누어 정의했다."
    note: "공개 가능한 범위와 결과는 확인한 뒤 보완할 예정입니다."

  - id: "sales-pi"
    title: "영업 PI"
    meta: "업무 프로세스 개선"
    status: "draft"
    summary: >-
      영업 업무 프로세스를 개선하는 과제에 AI 개발자로 참여하고 있다.
    note: "공개 가능한 범위를 확인한 뒤 역할과 진행 내용을 정리해 추가할 예정입니다."

  - id: "voxdelta"
    title: "VoxDelta"
    meta: "진행 중"
    status: "draft"
    note: "공개 가능한 소개를 정리한 뒤 추가할 예정입니다."
